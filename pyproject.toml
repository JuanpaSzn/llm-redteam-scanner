[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-redteam-scanner"
version = "0.1.0"
description = "Automated LLM red-teaming scanner: PAIR-style attacker/judge loop, stackable converters, MITRE ATLAS + OWASP LLM Top 10 tagging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Marín" }]
keywords = ["llm", "red-teaming", "prompt-injection", "jailbreak", "ai-security", "pair", "pyrit", "mitre-atlas"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
pyrit = ["pyrit>=1.2"]
hf = ["datasets>=2.19"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
redscan = "redscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
